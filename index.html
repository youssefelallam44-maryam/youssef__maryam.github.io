<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيد ميلاد سعيد مريم ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a0010, #4b0b2b, #12000b);
      color: white;
      overflow: hidden;
    }
    .card {
      width: min(90%, 650px);
      padding: 45px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 28px;
      background: rgba(255,255,255,.09);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      animation: appear 1.2s ease;
    }
    h1 { font-size: clamp(30px, 7vw, 52px); margin: 0 0 25px; }
    p { font-size: clamp(18px, 4vw, 25px); line-height: 2; margin: 0; }
    .heart { font-size: 58px; animation: beat 1.2s infinite; margin-bottom: 12px; }
    .birthday { margin-top: 25px; font-weight: bold; font-size: clamp(22px, 5vw, 32px); }
    @keyframes beat {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(25px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">❤️</div>
    <h1>إلى مريم</h1>
    <p>
      كنبغيك من قلبي، وبغيت نبقاو ديما مجموعين،
      نعيشو أجمل لحظاتنا ونكونو مع بعض فكل خطوة جاية. ❤️
    </p>
    <div class="birthday">عيد ميلاد سعيدة مريم 🎂❤️</div>
  </main>
</body>
</html>
